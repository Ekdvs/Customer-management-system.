spring:
  application:
    name: Customer-Management-System

  datasource:
    url: jdbc:mariadb://localhost:3306/customer_db
    username: root
    password: 123
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect


    defer-datasource-initialization: true

  sql:
    init:
      mode: never

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

server:
  port: 8080

logging:
  level:
    org.hibernate.SQL: DEBUG